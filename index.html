<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Collection</title>
    <link rel="stylesheet" href="styles/styles.css">
		<script src="scripts/script.js"></script>
</head>
<body>
    <header>
			<img 
				class="side-menu-img"
				src="img/side-menu.png" 
				alt="Menu lateral"
			/>
			<img 
				class="logo-img"
				src="img/logo.png" 
				alt="Logo"
			/>
			<img 
				class="perfil-img"
				src="img/profile.jpg" 
				alt="Foto de perfil"
			/>
    </header>

		<section class="secao-de-pesquisa">
			<input type="text">
			<button>Buscar</button>
		</section>

		<section class="resumo-colecao-secao">
			<div class="resumo-colecao">
					<h2>Resumo da Coleção</h2>
				<div>
					<p class="label">Valor total da coleção</p>
					<h3 class="value">R$ 8.475,00</h3>
					<p class="delta">▲ +5,2% em relação ao mês passado</p>
				</div>
				<ul>
					<li>
						<p>Total de cartas</p> 
						<p>324</p>
					</li>
					<li>
						<p>Cartas únicas</p>
						<p>129</p>
					</li>
					<li>
						<p>Coleções</p>
						<p>12</p>
					</li>
					<li>
						<p>Cartas desejadas</p>
						<p>23</p>
					</li>
				</ul>
			</div>
		</section>

		<section class="secao-colecoes">
			<div class="div-colecoes">
				<h3>Coleções</h3>	
				<div class="row-colecao">
					<p>151</p>
					<div class="progress-bar-colecao">
						<div class="progress-bar-colecao-fill" id="c-151"></div>
						<span>123/180</span>
					</div>
				</div>

				<div class="row-colecao">
					<p>Fogo fantasmagórico</p>
					<div class="progress-bar-colecao">
						<div class="progress-bar-colecao-fill" id="c-fogo-fantasmagorico"></div>
						<span>71/94</span>
					</div>
				</div>

				<div class="row-colecao">
					<p>Caos ascendente</p>
					<div class="progress-bar-colecao">
						<div class="progress-bar-colecao-fill" id="c-caos-ascendente"></div>
						<span>23/87</span>
					</div>
				</div>

			</div>

			
		</section>
</body>
</html>
